name: Run Telegram Vote Tracker Bot 2

on:
  schedule:
    # إعادة تشغيل البوت الثاني تلقائياً كل 5 ساعات
    - cron: '0 */5 * * *'
  push:
    branches: [ main ]
    paths-ignore:
      - 's.json'
      - 'config.json'
      - 'bot.py'
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: telegram-vote-bot2-group
  cancel-in-progress: true

jobs:
  run-bot2:
    runs-on: ubuntu-latest
    timeout-minutes: 310

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # إلغاء الجلسات السابقة الخاصة بالبوت الثاني فقط
      - name: Cancel older bot2 runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run_id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow "${{ github.workflow }}" --status in_progress --json databaseId -q '.[].databaseId'); do
            if [ "$run_id" != "$GITHUB_RUN_ID" ]; then
              echo "إيقاف الجلسة السابقة للبوت الثاني: $run_id"
              gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
            fi
          done
          sleep 2

      # تثبيت بايثون 3.10
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # تثبيت المكتبات المطلوبة
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # تشغيل البوت الثاني
      - name: Run Bot 2
        env:
          BOT_SECRET: ${{ secrets.BOT_SECRET || secrets['3bot'] || secrets.BOT_TOKEN }}
        run: python bot2.py